buildscript {
  repositories {
    mavenCentral()
    mavenLocal()
  }
}

allprojects {
  apply plugin: 'java'
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  repositories {
    mavenCentral()
    mavenLocal()
  }
}

ext {
  projectVersion = '0.2.7'
  projectGroupId = 'com.github.ItsNukea'
  distDir = file('dist/')
}

subprojects {
  // Binary Jar
  jar {
    destinationDirectory.set(rootProject.ext.distDir)
  }

  task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    destinationDirectory.set(rootProject.ext.distDir)
  }

  layout.buildDirectory = rootProject.layout.buildDirectory
}

project(':pathfinding') {
  dependencies {
    testImplementation 'junit:junit:4.10'
  }
}

tasks.eclipse.doLast {
  delete ".project"
}
