apply plugin: 'maven-publish'
apply plugin: 'signing'

group   = projectGroupId
version = projectVersion

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = [ "src/main/" ]
sourceSets.test.java.srcDirs = [ "src/tests/" ]

base {
  archivesName = 'pathfinding'
}

eclipse.project {
  name = base.archivesName.get()
}

// NOTE: publishing requires you to first set up
// 1) ~/.gnupg/* with a PGP key to sign the artifacts
// 2) ~/.gradle/gradle.properties defining
//
//    signing.keyId=<YOUR PGP KEY ID>
//    signing.password=<PASSWORD TO PGP SECRET RING>
//    signing.secretKeyRingFile=<FULLPATH TO PGP SECRET RING>
//    ossrhUsername=<Central Portal user token name>
//    ossrhPassword=<Central Portal user token password>

publishing {
  publications {
    pathfinding(MavenPublication) {
      from components.java
      artifact sourcesJar
      artifact javadocJar

      groupId    = projectGroupId
      artifactId = base.archivesName.get()
      version    = projectVersion

      pom {
        name = 'Path Finding'
        description = 'A generic java path finding library, meant to be used in games'
        url = 'https://github.com/xaguzman/pathfinding'
        packaging = 'jar'

        scm {
          connection = 'scm:git:git://github.com/xaguzman/pathfinding.git'
          developerConnection = 'scm:git:git@github.com:xaguzman/pathfinding.git'
          url = 'http://github.com/xaguzman/pathfinding'
        }

        licenses {
          license {
            name = 'The Apache Software License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }

        developers {
          developer {
            id = 'xaguzman'
            name = 'Xavier Guzman'
            email = 'xaguzman@gmail.com'
            timezone = 'CST  (GMT-6)'
          }
        }
      }
    }
  }

  repositories {
    maven {
      name = 'ossrh'
      url = project.version.toString().endsWith('-SNAPSHOT')
              ? 'https://central.sonatype.com/repository/maven-snapshots/'
              : 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
      credentials {
        username = findProperty('ossrhUsername')
        password = findProperty('ossrhPassword')
      }
    }
  }
}

signing {
  // only require signing when actually publishing
  required = providers.provider { gradle.taskGraph.allTasks.any { it.name.startsWith('publish') } }
  sign publishing.publications.pathfinding
}