apply plugin: 'maven-publish'

group   = rootProject.ext.projectGroupId
version = rootProject.ext.projectVersion

java {
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = [ "src/main/" ]
sourceSets.test.java.srcDirs = [ "src/tests/" ]

base {
  archivesName = 'pathfinding'
}

eclipse.project {
  name = base.archivesName.get()
}

// JitPack runs `publishToMavenLocal` on this module and serves the result.
// No signing and no remote repository are needed.
publishing {
  publications {
    pathfinding(MavenPublication) {
      from components.java
      artifact sourcesJar

      groupId    = rootProject.ext.projectGroupId
      artifactId = base.archivesName.get()
      version    = rootProject.ext.projectVersion

      pom {
        name = 'Path Finding'
        description = 'A generic java path finding library, meant to be used in games'
        url = 'https://github.com/ItsNukea/pathfinding'
        packaging = 'jar'

        scm {
          connection = 'scm:git:git://github.com/ItsNukea/pathfinding.git'
          developerConnection = 'scm:git:git@github.com:ItsNukea/pathfinding.git'
          url = 'https://github.com/ItsNukea/pathfinding'
        }

        licenses {
          license {
            name = 'The Apache Software License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }

        developers {
          developer {
            id = 'ItsNukea'
            name = 'Nukea'
            url = 'https://github.com/ItsNukea'
          }
          developer {
            id = 'xaguzman'
            name = 'Xavier Guzman'
            url = 'https://github.com/xaguzman'
            roles = ['original author']
          }
        }
      }
    }
  }
}
